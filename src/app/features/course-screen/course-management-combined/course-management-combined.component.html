<div class="mx-auto max-w-5xl px-6 py-10 animate-fade-in">
  <!-- Premium Header -->
  <header class="mb-10 relative">
    <div class="absolute -left-6 top-1/2 -translate-y-1/2 w-1.5 h-10 rounded-full" [style.backgroundColor]="brand">
    </div>
    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Gestionar Cursos</h1>
    <p class="mt-2 text-slate-500 text-sm leading-relaxed max-w-2xl">
      Configura y administra la oferta académica de asignaturas, los planes de estudio correspondientes y las
      clasificaciones por tipo de curso.
    </p>
  </header>

  <!-- Modern Interactive Tabs -->
  <div
    class="mb-8 border-b border-slate-200/80 bg-white/60 backdrop-blur-md sticky top-0 rounded-t-2xl shadow-sm border border-slate-100 p-2"
    [class.z-40]="!sidebarService.modalOpen()" [class.z-0]="sidebarService.modalOpen()">
    <nav class="flex space-x-2" aria-label="Tabs">
      <button (click)="setTab('course')"
        [class]="activeTab === 'course' ? 'bg-slate-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
        class="flex-1 text-center py-3.5 px-4 rounded-xl font-semibold text-sm transition-all duration-300 ease-out active:scale-98">
        Cursos / Asignaturas
      </button>
      <button (click)="setTab('plan')"
        [class]="activeTab === 'plan' ? 'bg-slate-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
        class="flex-1 text-center py-3.5 px-4 rounded-xl font-semibold text-sm transition-all duration-300 ease-out active:scale-98">
        Planes de Estudios
      </button>
      <button (click)="setTab('type')"
        [class]="activeTab === 'type' ? 'bg-slate-900 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
        class="flex-1 text-center py-3.5 px-4 rounded-xl font-semibold text-sm transition-all duration-300 ease-out active:scale-98">
        Tipos de Cursos
      </button>
    </nav>
  </div>

  <!-- Dynamic Content Area -->
  <main>
    <div *ngIf="activeTab === 'course'">
      <app-course [hideBack]="true"></app-course>
    </div>
    <div *ngIf="activeTab === 'plan'">
      <app-plan [hideBack]="true"></app-plan>
    </div>
    <div *ngIf="activeTab === 'type'">
      <app-course-type [hideBack]="true"></app-course-type>
    </div>
  </main>
</div>
