<div class="mx-auto max-w-4xl px-6 py-8">
  <div *ngIf="showToast" class="fixed top-5 right-5 z-50">
    <div
      class="toast rounded-md bg-emerald-600 px-4 py-2 text-white shadow-sm inline-flex items-center gap-3"
    >
      <span>{{ toastMessage }}</span>

    </div>
  </div>



  <button
    *ngIf="!hideBack"
    (click)="volver()"
    class="mb-4 inline-flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 19l-7-7 7-7"
      ></path>
    </svg>
    Volver a opciones
  </button>

  <h1 class="text-2xl font-bold text-slate-800 mb-4">Planes</h1>

  <section
    class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"
  >
    <h2 class="text-base font-semibold mb-3">Crear Plan</h2>
    <div class="flex gap-3">
      <input
        type="text"
        [(ngModel)]="name"
        placeholder="Nombre del plan"
        class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"
      />
      <button
        (click)="create()"
        class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-900"
        style="background: #bfc621"
      >
        Guardar
      </button>
    </div>
  </section>

  <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-base font-semibold mb-3">Lista de Planes</h2>
    <div class="overflow-x-auto">
      <table class="w-full table-auto text-left">
        <thead class="bg-slate-50">
          <tr
            class="text-xs font-semibold uppercase tracking-wide text-slate-500"
          >
            <th class="px-4 py-3">#</th>
            <th class="px-4 py-3">Nombre</th>
            <th class="px-4 py-3">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let p of items; let i = index"
            class="border-t border-slate-100 text-sm text-slate-700"
          >
            <td class="px-4 py-3">{{ i + 1 }}</td>
            <td class="px-4 py-3">
              <ng-container *ngIf="editingId !== p.idPlan; else editName">{{
                p.name
              }}</ng-container>
              <ng-template #editName>
                <input
                  [(ngModel)]="editingName"
                  class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"
                />
              </ng-template>
            </td>
            <td class="px-4 py-3">
              <div class="flex items-center gap-3 relative">
                <ng-container
                  *ngIf="editingId !== p.idPlan; else editingActions"
                >
                  <button
                    (click)="edit(p)"
                    title="Editar"
                    class="text-slate-600 hover:text-emerald-700"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15.232 5.232l3.536 3.536M9 11l6-6 3 3-6 6H9v-3z"
                      />
                    </svg>
                  </button>
                  <div class="relative inline-block">
                    <button
                      (click)="confirmRemove(p, $event)"
                      title="Eliminar"
                      class="text-slate-600 hover:text-red-600"
                    >
                      <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M19 7l-1 12a2 2 0 01-2 2H8a2 2 0 01-2-2L5 7m5-4h4m-7 4v12m6-12v12"
                        />
                      </svg>
                    </button>
                    <!-- Popover local de confirmación (Flotación a la izquierda inteligente) -->
                    <div
                      *ngIf="pendingDeleteId === p.idPlan"
                      class="absolute bottom-1/2 translate-y-1/2 right-full mr-3 z-50 w-60 rounded-xl border border-slate-200 bg-white p-4 shadow-xl text-left animate-fade-in"
                    >
                      <div class="text-xs font-bold text-slate-800">
                        ¿Seguro que quieres eliminar?
                      </div>
                      <div class="mt-1 text-xs text-slate-500">
                        Se eliminará: <strong class="text-slate-700">{{ pendingDeleteName }}</strong>
                      </div>
                      <div class="mt-3 flex gap-2 justify-end">
                        <button
                          (click)="performDeleteConfirmed()"
                          class="rounded-lg px-3 py-1.5 text-xs font-bold text-white bg-red-600 hover:bg-red-700 transition-colors shadow-sm active:scale-95"
                        >
                          Eliminar
                        </button>
                        <button
                          (click)="cancelRemove()"
                          class="rounded-lg px-3 py-1.5 text-xs font-bold text-slate-700 border border-slate-200 bg-white hover:bg-slate-50 transition-colors active:scale-95"
                        >
                          Cancelar
                        </button>
                      </div>
                    </div>
                  </div>
                </ng-container>
                <ng-template #editingActions>
                  <button
                    (click)="save()"
                    title="Guardar cambios"
                    class="text-green-600 hover:text-green-800"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7"
                      />
                    </svg>
                  </button>
                  <button
                    (click)="cancel()"
                    title="Cancelar"
                    class="text-slate-600 hover:text-gray-800"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"
                      />
                    </svg>
                  </button>
                </ng-template>
              </div>
            </td>
          </tr>
          <tr *ngIf="items.length === 0">
            <td
              colspan="3"
              class="px-4 py-6 text-center text-sm text-slate-500"
            >
              No hay planes disponibles
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>


</div>
