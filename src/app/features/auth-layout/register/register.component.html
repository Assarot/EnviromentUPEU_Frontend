<div class="register-container" [attr.data-theme]="themeService.theme()">

  <!-- ══ TOGGLE TEMA ══ -->
  <button
    id="btn-theme-toggle-register"
    class="theme-toggle"
    (click)="themeService.toggle()"
    [title]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
    <span class="toggle-track">
      <span class="toggle-thumb" [class.toggle-thumb--light]="!themeService.isDark()">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </span>
    </span>
    <span class="toggle-label">{{ themeService.isDark() ? 'Oscuro' : 'Claro' }}</span>
  </button>

  <!-- ══ LOGO / HEADER ══ -->
  <div class="register-header">
    <div class="logo-wrapper">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
    </div>
    <h1 class="register-title">Crear cuenta</h1>
    <p class="register-subtitle">Completa los datos para registrarte en el sistema</p>
  </div>

  <!-- ══ FORMULARIO ══ -->
  <form class="register-form" #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">

    <!-- Fila: Nombre + Apellido Paterno -->
    <div class="fields-row">

      <!-- Nombre -->
      <div class="field-group">
        <label for="reg-nombre" class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Nombre
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="reg-nombre"
            name="nombre"
            class="field-input"
            placeholder="Marcos"
            required
          />
          <span class="input-focus-bar"></span>
        </div>
      </div>

      <!-- Apellido Paterno -->
      <div class="field-group">
        <label for="reg-lastname" class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Ap. Paterno
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="reg-lastname"
            name="lastname"
            class="field-input"
            placeholder="Martínez"
            required
          />
          <span class="input-focus-bar"></span>
        </div>
      </div>

    </div>

    <!-- Apellido Materno -->
    <div class="field-group">
      <label for="reg-materno" class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Apellido Materno
      </label>
      <div class="input-wrapper">
        <input
          type="text"
          id="reg-materno"
          name="materno"
          class="field-input"
          placeholder="Rodríguez"
          required
        />
        <span class="input-focus-bar"></span>
      </div>
    </div>

    <!-- Usuario -->
    <div class="field-group">
      <label for="reg-username" class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Nombre de usuario
      </label>
      <div class="input-wrapper">
        <input
          type="text"
          id="reg-username"
          name="username"
          [(ngModel)]="username"
          class="field-input"
          placeholder="marcos.martinez"
          required
        />
        <span class="input-focus-bar"></span>
      </div>
    </div>

    <!-- Correo electrónico -->
    <div class="field-group">
      <label for="reg-email" class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Correo electrónico
      </label>
      <div class="input-wrapper">
        <input
          type="email"
          id="reg-email"
          name="email"
          class="field-input"
          placeholder="correo@upeu.edu.pe"
          required
        />
        <span class="input-focus-bar"></span>
      </div>
    </div>

    <!-- Fila: Contraseña + Confirmar -->
    <div class="fields-row">

      <!-- Contraseña -->
      <div class="field-group">
        <label for="reg-password" class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Contraseña
        </label>
        <div class="input-wrapper">
          <input
            type="password"
            id="reg-password"
            name="password"
            [(ngModel)]="password"
            class="field-input"
            placeholder="••••••••"
            required
          />
          <span class="input-focus-bar"></span>
        </div>
      </div>

      <!-- Confirmar Contraseña -->
      <div class="field-group">
        <label for="reg-confirm" class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Confirmar
        </label>
        <div class="input-wrapper">
          <input
            type="password"
            id="reg-confirm"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            class="field-input"
            placeholder="••••••••"
            required
          />
          <span class="input-focus-bar"></span>
        </div>
      </div>

    </div>

    <!-- Términos y condiciones -->
    <label class="terms-label">
      <input id="reg-terms" type="checkbox" name="terms" class="terms-checkbox" required />
      <span class="terms-custom"></span>
      <span class="terms-text">
        Acepto los
        <a href="#" class="terms-link">Términos y Condiciones</a>
      </span>
    </label>

    <!-- Botón Submit -->
    <button
      type="submit"
      id="btn-register-submit"
      [disabled]="isSubmitting"
      class="btn-submit"
      [class.loading]="isSubmitting">
      @if (isSubmitting) {
        <span class="btn-spinner"></span>
        <span>Creando cuenta...</span>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span>Crear cuenta</span>
      }
    </button>

  </form>

  <!-- ══ FOOTER ══ -->
  <div class="register-footer">
    <div class="divider-line">
      <span></span><p>¿Ya tienes una cuenta?</p><span></span>
    </div>
    <a [routerLink]="['/login']" id="link-go-login" class="btn-login-link">
      Iniciar sesión
    </a>
  </div>

</div>
