<div class="p-6 max-w-4xl mx-auto min-h-[calc(100vh-100px)]">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
      <span class="w-3 h-3 rounded-full" style="background-color: #BFC621;"></span>
      Notificaciones
    </h1>
    <p class="mt-1.5 text-sm text-slate-500 max-w-xl leading-relaxed">
      Mantente al tanto de las actualizaciones sobre tus solicitudes de reserva.
    </p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading"
    class="flex flex-col items-center justify-center py-20 bg-white rounded-3xl border border-slate-100 shadow-sm">
    <div class="relative w-10 h-10 mb-4">
      <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
      <div class="absolute inset-0 border-4 border-[#BFC621] rounded-full border-t-transparent animate-spin"></div>
    </div>
    <p class="text-sm font-medium text-slate-500">Cargando notificaciones...</p>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && notifications.length === 0"
    class="text-center py-20 bg-white rounded-3xl border border-slate-100 shadow-sm">
    <svg class="mx-auto h-16 w-16 text-slate-300 mb-4" fill="none" stroke="currentColor" stroke-width="1.5"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    <h3 class="text-lg font-bold text-slate-700 mb-1">Todo al día</h3>
    <p class="text-sm text-slate-500 max-w-sm mx-auto">
      No tienes notificaciones nuevas por el momento.
    </p>
  </div>

  <!-- Notifications List -->
  <div *ngIf="!isLoading && notifications.length > 0"
    class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden divide-y divide-slate-100">
    <div *ngFor="let notif of notifications" (click)="markAsRead(notif)" [class.bg-slate-50]="notif.is_read"
      [class.hover:bg-slate-50]="!notif.is_read" class="p-5 flex gap-4 transition-colors cursor-pointer relative group">

      <!-- Unread indicator line -->
      <div *ngIf="!notif.is_read" class="absolute left-0 top-0 bottom-0 w-1 bg-[#BFC621]"></div>

      <!-- Icon -->
      <div class="shrink-0 mt-1">
        <div class="w-10 h-10 rounded-full flex items-center justify-center" [ngClass]="getIconClass(notif.type)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            [innerHtml]="getIconSvg(notif.type)"></svg>
        </div>
      </div>

      <!-- Content -->
      <div class="flex-1">
        <div class="flex justify-between items-start gap-4 mb-1">
          <p class="text-sm text-slate-800 leading-relaxed font-medium">
            {{ notif.message }}
          </p>
          <span class="text-[11px] font-bold text-slate-400 whitespace-nowrap shrink-0 mt-0.5 uppercase tracking-wider">
            {{ formatDate(notif.created_at) }}
          </span>
        </div>

        <!-- Status badge/indicator if needed -->
        <div *ngIf="!notif.is_read"
          class="mt-2 inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider text-[#BFC621] bg-[#BFC621]/10">
          <span class="w-1.5 h-1.5 rounded-full bg-[#BFC621]"></span>
          Nueva
        </div>
      </div>

    </div>
  </div>
</div>
